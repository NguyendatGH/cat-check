# Ghi đè message mặc định của Hibernate Validator (Bean Validation) theo tiếng Việt.
#
# LƯU Ý VỊ TRÍ: đặt ở gốc classpath (src/main/resources/), KHÔNG trong messages/, vì Hibernate
# Validator's ResourceBundleMessageInterpolator mặc định tra bundle tên "ValidationMessages" từ
# gốc classpath (ResourceBundle.getBundle("ValidationMessages", locale)) - đặt trong thư mục con
# sẽ khiến Hibernate Validator KHÔNG tìm thấy file này nếu không cấu hình ResourceBundleLocator
# riêng (chưa cần ở M0). Đây là khác biệt so với messages/messages_*.properties và
# messages/errors_*.properties (2 bundle đó do MessageResolver/MessageSource của CatCheck tự
# quản lý, không bị ràng buộc bởi quy ước của Hibernate Validator).
#
# Rỗng khung ở M0 - chưa có constraint nghiệp vụ nào cần custom message riêng ngoài message mặc
# định của Hibernate Validator 9.1.3.Final.
