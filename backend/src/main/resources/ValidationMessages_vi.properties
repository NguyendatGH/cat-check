# Message của các ràng buộc Bean Validation trong DTO (message = "{validation.xxx}"), tiếng Việt.
#
# LƯU Ý VỊ TRÍ: đặt ở gốc classpath (src/main/resources/), KHÔNG trong messages/, vì Hibernate
# Validator's ResourceBundleMessageInterpolator mặc định tra bundle tên "ValidationMessages" từ
# gốc classpath (ResourceBundle.getBundle("ValidationMessages", locale)) - đặt trong thư mục con
# sẽ khiến Hibernate Validator KHÔNG tìm thấy file này nếu không cấu hình ResourceBundleLocator
# riêng. Locale lấy từ LocaleContextHolder (LocaleConfig#localeResolver, header Accept-Language).
# Bộ khoá phải trùng khít với ValidationMessages_en.properties.

# cat
validation.cat.name.required=Vui lòng nhập tên bé mèo
validation.cat.name.max=Tên bé mèo tối đa 60 ký tự
validation.cat.weight.min=Cân nặng phải lớn hơn 0
validation.cat.weight.max=Cân nặng phải nhỏ hơn 30
validation.cat.note.required=Nội dung ghi chú không được để trống
validation.cat.note.max=Ghi chú tối đa 2000 ký tự

# scan
validation.scan.capturedAt.required=capturedAt là bắt buộc
validation.scan.ph.min=pH phải >= 3.0
validation.scan.ph.max=pH phải <= 11.0

# privacy
validation.privacy.requestType.required=requestType không được trống
validation.privacy.requestType.invalid=requestType không hợp lệ
validation.privacy.channel.invalid=channel không hợp lệ
validation.privacy.version.format=version phải là semver MAJOR.MINOR[.PATCH]
validation.privacy.locale.invalid=locale chỉ nhận vi hoặc en
validation.privacy.purposeCode.required=purposeCode không được trống
validation.privacy.purposeCode.invalid=purposeCode không hợp lệ
validation.privacy.surface.required=surface không được trống
validation.privacy.surface.invalid=surface không hợp lệ
validation.privacy.consents.required=consents không được rỗng

# content
validation.content.slug.format=slug phải là kebab-case chữ thường
validation.content.locale.invalid=locale chỉ nhận 'vi' hoặc 'en'
validation.content.reason.min=reason phải dài tối thiểu 10 ký tự

# colorchart
validation.colorchart.hexSrgb.format=hexSrgb phải là #RRGGBB
validation.colorchart.displayHex.format=displayHex phải là #RRGGBB
validation.colorchart.window.format=window phải là chu kỳ ISO-8601, ví dụ P90D
