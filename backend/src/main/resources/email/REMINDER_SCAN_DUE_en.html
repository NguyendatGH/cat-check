<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan reminder for {{catName}}</title>
</head>
<body style="margin:0;padding:0;background:#f5f4ef;font-family:Arial,Helvetica,sans-serif;color:#1c1f1b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f4ef;">
  <tr>
    <td align="center" style="padding:24px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;">
        <tr>
          <td style="padding:28px 28px 8px;font-size:18px;font-weight:bold;color:#1f6b58;">CatCheck</td>
        </tr>
        <tr>
          <td style="padding:8px 28px 0;font-size:15px;line-height:1.6;">
            <p style="margin:0 0 12px;">It is time to scan the litter tray for <strong>{{catName}}</strong>.</p>
            <p style="margin:0 0 12px;">Scan regularly so CatCheck can track trends over time.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:12px 28px 24px;">
            <a href="{{appUrl}}{{deepLink}}" style="display:inline-block;padding:12px 22px;background:#1f6b58;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:bold;">Open CatCheck to scan</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px;border-top:1px solid #d9d7cc;font-size:12px;line-height:1.5;color:#5f655b;">
            You can turn off this reminder in the CatCheck notification settings. This email was sent automatically; please do not reply.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
