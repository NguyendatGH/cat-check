# Bean Validation constraint messages used by DTOs (message = "{validation.xxx}"), English.
# Placed at classpath root (see ValidationMessages_vi.properties for why). The key set must match
# ValidationMessages_vi.properties exactly.

# cat
validation.cat.name.required=Please enter your cat's name
validation.cat.name.max=Cat name must be at most 60 characters
validation.cat.weight.min=Weight must be greater than 0
validation.cat.weight.max=Weight must be less than 30
validation.cat.note.required=Note content must not be empty
validation.cat.note.max=Note must be at most 2000 characters

# scan
validation.scan.capturedAt.required=capturedAt is required
validation.scan.ph.min=pH must be >= 3.0
validation.scan.ph.max=pH must be <= 11.0

# privacy
validation.privacy.requestType.required=requestType must not be blank
validation.privacy.requestType.invalid=requestType is invalid
validation.privacy.channel.invalid=channel is invalid
validation.privacy.version.format=version must be semver MAJOR.MINOR[.PATCH]
validation.privacy.locale.invalid=locale accepts only vi or en
validation.privacy.purposeCode.required=purposeCode must not be blank
validation.privacy.purposeCode.invalid=purposeCode is invalid
validation.privacy.surface.required=surface must not be blank
validation.privacy.surface.invalid=surface is invalid
validation.privacy.consents.required=consents must not be empty

# content
validation.content.slug.format=slug must be lowercase kebab-case
validation.content.locale.invalid=locale accepts only 'vi' or 'en'
validation.content.reason.min=reason must be at least 10 characters long

# colorchart
validation.colorchart.hexSrgb.format=hexSrgb must be #RRGGBB
validation.colorchart.displayHex.format=displayHex must be #RRGGBB
validation.colorchart.window.format=window must be an ISO-8601 duration, for example P90D
