
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catcheck
    username: catcheck
    password: catcheck_local_only
    driver-class-name: org.postgresql.Driver

  flyway:
    out-of-order: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_EMAIL:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          from: ${SMTP_EMAIL:}

catcheck:
  dev:
    log-otp: true
  storage:
    local:
      url-signing-key: catcheck_local_dev_url_signing_key_only
  notification:
    email-sink: smtp

logging:
  level:
    com.catcheck: DEBUG
    com.catcheck.shared.config.JdbcTemplateConfig$1: INFO
    org.springframework.modulith: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,mappings,loggers,flyway
  endpoint:
    health:
      show-details: always
