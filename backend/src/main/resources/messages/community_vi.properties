# Khoá = tên hằng CommunityErrorCode.
POST_NOT_FOUND=Không tìm thấy bài viết này.
REPORT_TARGET_REQUIRED=Vui lòng chọn một bài viết hoặc một bình luận để báo cáo.
REPORT_NOT_FOUND=Không tìm thấy nội dung cần báo cáo.
REPORT_DUPLICATE=Bạn đã báo cáo nội dung này và báo cáo đang được xử lý.
MODERATION_ACTION_INVALID=Thao tác kiểm duyệt không hợp lệ.
