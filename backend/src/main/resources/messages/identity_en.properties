# Identity module — English messages (p8 §8.2.4).
# Key: <CODE> - matches IdentityErrorCode.code() (NO "error." prefix).

INVALID_CREDENTIALS=Email or password is incorrect. Please check and try again.
UNAUTHENTICATED=Please sign in to continue.
SESSION_EXPIRED=Your session has expired. Please sign in again.
SESSION_ABSOLUTE_EXPIRED=For security reasons, please sign in again.
SESSION_NOT_FOUND=This session no longer exists.
REAUTH_REQUIRED=Please verify your identity to continue.
REAUTH_FAILED=Identity verification failed. Please try again.
