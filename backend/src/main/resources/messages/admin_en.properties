# Error messages for the admin module (AdminOpsErrorCode, AdminIdempotency.Code). Key = enum constant name.

# {0} = app_setting key
SETTING_KEY_UNKNOWN=Setting key {0} does not exist.
# {0} = job name
JOB_NOT_FOUND=No background job is named {0}.
# {0} = list of manually runnable jobs
JOB_NOT_MANUALLY_RUNNABLE=This job cannot be run manually yet. Manually runnable jobs: {0}.
# {0} = job name
JOBS_DISABLED=Cannot run {0} because background jobs are disabled (catcheck.jobs.enabled = false).
# {0} = outbox entry id
OUTBOX_ENTRY_NOT_FOUND=Outbox entry {0} was not found.
# {0} = outbox entry id
OUTBOX_ENTRY_NOT_FAILED=Outbox entry {0} is not FAILED, so it cannot be resent.
# {0} = allowed templates
BROADCAST_TEMPLATE_NOT_ALLOWED=This template cannot be broadcast. Allowed templates: {0}.
BROADCAST_CONFIRMATION_REQUIRED=A live broadcast must be confirmed (confirmed = true). Run a dry run first.

IDEMPOTENCY_KEY_MISSING=The Idempotency-Key header is missing.
IDEMPOTENCY_KEY_INVALID=The Idempotency-Key header must be a UUID.
