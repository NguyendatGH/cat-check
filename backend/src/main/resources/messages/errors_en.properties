# Shared error messages (not tied to any specific screen) - used by shared.error.GlobalExceptionHandler.
# Module-specific business error messages (keyed by ErrorCode.code(), e.g. "SCAN-001=...") are
# added by each module from M1+, NOT here.
validation.failed=The submitted data is invalid.
error.unexpected=An unexpected error occurred. Please try again later.
error.not-found=The requested resource was not found.
error.method-not-allowed=The request method is not supported for this path.

error.payload_too_large=The uploaded file exceeds the allowed size. Please choose a smaller image.
