# Ma loi cua module media (MediaErrorCode). Khoa = ten hang enum.
# Tham so cua cac ma nay (content type, khoa luu tru, so byte, mo ta loi noi bo) CO Y khong dua vao
# cau: khoa luu tru va mo ta loi la thong tin noi bo, content type la gia tri client tu gui.
STORAGE_UNSUPPORTED_TYPE=Định dạng ảnh không được hỗ trợ. Hãy dùng ảnh JPEG, PNG hoặc WebP.
STORAGE_PAYLOAD_TOO_LARGE=Ảnh vượt quá dung lượng cho phép. Hãy chọn ảnh nhỏ hơn.
STORAGE_KEY_NOT_FOUND=Không tìm thấy ảnh được yêu cầu.
STORAGE_IO_ERROR=Lưu trữ ảnh đang gặp sự cố. Vui lòng thử lại sau.
