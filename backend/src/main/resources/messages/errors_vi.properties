# Message lỗi dùng chung (không gắn với màn hình cụ thể nào) - dùng bởi shared.error.GlobalExceptionHandler.
# Message lỗi nghiệp vụ riêng của từng module (theo mã ErrorCode.code(), ví dụ "SCAN-001=...")
# sẽ được module đó tự bổ sung từ M1+, KHÔNG đặt ở đây.
# Encoding: UTF-8 (xem shared.i18n.LocaleConfig#messageSource - setDefaultEncoding("UTF-8")).
validation.failed=Dữ liệu gửi lên không hợp lệ.
error.unexpected=Đã xảy ra lỗi không mong muốn. Vui lòng thử lại sau.
error.not-found=Không tìm thấy tài nguyên yêu cầu.
error.method-not-allowed=Phương thức yêu cầu không được hỗ trợ cho đường dẫn này.

error.payload_too_large=Tệp tải lên vượt quá dung lượng cho phép. Hãy chọn ảnh nhỏ hơn.
