# Privacy module error messages (module `privacy`, A2). English variant.
# Keys mirror privacy_vi.properties; values may stay in English until W3 wires the
# module basename into the MessageSource (see docs/handovers/A2.md).

# {0} = purposeCode, {1} = alternativeAction (DELETE_ACCOUNT)
CONSENT_MANDATORY_CANNOT_WITHDRAW=Purpose {0} is required to provide the service. If you no longer want CatCheck to process your data, please use Delete Account.

# {0} = purposeCode, {1} = purposeLabel
CONSENT_REQUIRED=You need to consent to purpose "{1}" to use this feature. Open Privacy Center to grant consent.

# {0} = docCode, {1} = version
POLICY_REACCEPT_REQUIRED=Policy {0} has been updated (version {1}). Please review and accept to continue.

POLICY_VERSION_NOT_FOUND=This document version was not found.

DSAR_NOT_FOUND=Request not found.

# {0} = challengeId, {1} = email (masked)
DSAR_IDENTITY_VERIFICATION_REQUIRED=Please verify your identity with the code sent to your email.

# {0} = retryAfterSeconds, {1} = lastRequestedAt
DSAR_EXPORT_RATE_LIMITED=You can create 1 data export every 24 hours. Please try again later.

# {0} = status
DSAR_EXPORT_NOT_READY=Your data export is being prepared. We will notify you when it is ready.

# {0} = expiredAt
DSAR_EXPORT_EXPIRED=The download link expired after 72 hours. Please create a new request.

# {0} = downloadedAt
DSAR_EXPORT_ALREADY_DOWNLOADED=This export has already been downloaded. Each link can be used only once.

# {0} = publicRef, {1} = scheduledAt, {2} = cancelUntil
DELETION_ALREADY_REQUESTED=You have already requested account deletion. It will be executed on the scheduled date.

# {0} = executedAt
DELETION_GRACE_EXPIRED=The cancellation window has passed. Account deletion is in progress.

DELETION_NOT_REQUESTED=There is no pending account deletion request.

# {0} = allowed[] (array of supported type names)
DSAR_REQUEST_TYPE_UNSUPPORTED=Unsupported request type. Supported types: {0}.

RESTRICTION_ALREADY_ACTIVE=Your account is already in processing restriction mode.

VALIDATION_FAILED=The data is invalid. Please check the highlighted fields.

FORBIDDEN=You do not have permission to perform this action.

# {0} = retryAfterSeconds, {1} = scope
RATE_LIMITED=You are moving a bit too fast. Please try again in a few minutes.

# {0} = purposeCode
CONSENT_PURPOSE_UNKNOWN=Invalid data processing purpose.

# {0} = maxBytes, {1} = allowedTypes[]
AVATAR_INVALID=Invalid image. Please choose a JPG, PNG or WebP image within the allowed size.

PAGINATION_CURSOR_INVALID=The list has changed. Reloading from the beginning.
