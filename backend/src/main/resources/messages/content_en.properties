# Business error messages for the content module (care_tip), keyed by ContentErrorCode#code().
#
# Real bug fixed: this bundle did not exist and "classpath:messages/content" was missing from
# LocaleConfig#messageSource's basenames, so every ContentErrorCode (L40-L45: not-found,
# source-required, self-approval-forbidden, not-editable, invalid-state, slug-taken) fell back to
# setUseCodeAsDefaultMessage(true) and returned the raw enum name (e.g. "CONTENT_NOT_FOUND") to
# the client instead of a translated sentence, even though CareTipAdminService already computes
# the right arguments (old/new status, slug, locale...) to interpolate.
#
# REASON_REQUIRED/VALIDATION_FAILED are intentionally NOT declared here: both codes share their
# name with an unrelated code of the same name in colorchart/identity (ErrorCode#code() uses
# name() as the lookup key, not yet namespaced per module - see the "W3 gộp lại" note on
# ContentErrorCode), and ReloadableResourceBundleMessageSource#getMessage only uses the FIRST
# basename in the list that contains the key (confirmed with a manual probe) - colorchart/identity
# come before content in the basenames list, so a translation declared here would never be
# selected. Not adding dead entries; see the review report for the proper cross-module fix (W3).
CONTENT_NOT_FOUND=The requested care tip was not found.
CONTENT_SOURCE_REQUIRED=Content with claim type "{0}" must include a source reference before publishing.
CONTENT_SELF_APPROVAL_FORBIDDEN=The author cannot approve their own content.
CONTENT_NOT_EDITABLE=Content in status {0} cannot be edited directly.
CONTENT_INVALID_STATE=Cannot transition content from {0} to {1}.
CONTENT_SLUG_TAKEN=Slug "{0}" already exists for locale "{1}".
