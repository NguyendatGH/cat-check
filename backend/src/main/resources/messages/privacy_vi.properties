# Thông điệp lỗi nghiệp vụ của module privacy (module `privacy`, A2).
#
# Khoá = tên hằng PrivacyErrorCode. Tra qua shared.i18n.MessageResolver với tham số
# {0}, {1}... theo thứ tự khai trong javadoc của từng hằng.
#
# QUY TẮC COPY: KHÔNG hứa hẹn y tế. Cát vệ sinh đổi màu là DẤU HIỆU tham khảo, không phải
# chẩn đoán. Mọi thông điệp chỉ nói về quyền và số liệu, không nói về sức khoẻ mèo.
#
# Bốn hằng dùng chung (VALIDATION_FAILED, FORBIDDEN, RATE_LIMITED,
# CONSENT_PURPOSE_UNKNOWN) và AVATAR_INVALID / PAGINATION_CURSOR_INVALID không được đăng ký
# bean vào ErrorCodeRegistry (đã thuộc nhóm (a)/(b)/(c) của p8, xem javadoc PrivacyErrorCode)
# — vẫn có message để GlobalExceptionHandler tra được khi service ném.

# {0} = purposeCode, {1} = alternativeAction (DELETE_ACCOUNT)
CONSENT_MANDATORY_CANNOT_WITHDRAW=Mục đích {0} là bắt buộc để cung cấp dịch vụ. Nếu bạn không muốn CatCheck xử lý dữ liệu nữa, hãy dùng chức năng Xoá tài khoản.

# {0} = purposeCode, {1} = purposeLabel
CONSENT_REQUIRED=Bạn cần đồng ý mục đích "{1}" để dùng tính năng này. Vào Trung tâm quyền riêng tư để cấp đồng ý.

# {0} = docCode, {1} = version
POLICY_REACCEPT_REQUIRED=Chính sách {0} đã được cập nhật (phiên bản {1}). Vui lòng xem và đồng ý để tiếp tục.

POLICY_VERSION_NOT_FOUND=Không tìm thấy phiên bản tài liệu này.

DSAR_NOT_FOUND=Không tìm thấy yêu cầu này.

# {0} = challengeId, {1} = email (đã che)
DSAR_IDENTITY_VERIFICATION_REQUIRED=Vui lòng xác nhận danh tính bằng mã gửi tới email của bạn.

# {0} = retryAfterSeconds, {1} = lastRequestedAt
DSAR_EXPORT_RATE_LIMITED=Bạn chỉ tạo được 1 bản sao dữ liệu mỗi 24 giờ. Thử lại sau.

# {0} = status
DSAR_EXPORT_NOT_READY=Bản sao dữ liệu đang được chuẩn bị. Chúng tôi sẽ báo khi sẵn sàng.

# {0} = expiredAt
DSAR_EXPORT_EXPIRED=Liên kết tải đã hết hạn sau 72 giờ. Vui lòng tạo yêu cầu mới.

# {0} = downloadedAt
DSAR_EXPORT_ALREADY_DOWNLOADED=Bản sao dữ liệu này đã được tải. Vì lý do bảo mật, mỗi liên kết chỉ dùng được một lần.

# {0} = publicRef, {1} = scheduledAt, {2} = cancelUntil
DELETION_ALREADY_REQUESTED=Bạn đã gửi yêu cầu xoá tài khoản. Yêu cầu sẽ được thực hiện theo lịch đã chốt.

# {0} = executedAt
DELETION_GRACE_EXPIRED=Đã quá thời hạn huỷ. Việc xoá tài khoản đang được thực hiện.

DELETION_NOT_REQUESTED=Không có yêu cầu xoá tài khoản nào đang chờ.

# {0} = allowed[] (mảng tên loại hợp lệ)
DSAR_REQUEST_TYPE_UNSUPPORTED=Loại yêu cầu không hợp lệ. Các loại hỗ trợ: {0}.

RESTRICTION_ALREADY_ACTIVE=Tài khoản đã ở chế độ hạn chế xử lý.

VALIDATION_FAILED=Dữ liệu chưa hợp lệ. Vui lòng kiểm tra lại.

FORBIDDEN=Bạn không có quyền thực hiện thao tác này.

# {0} = retryAfterSeconds, {1} = scope
RATE_LIMITED=Bạn thao tác hơi nhanh. Vui lòng thử lại sau ít phút.

# {0} = purposeCode
CONSENT_PURPOSE_UNKNOWN=Mục đích xử lý dữ liệu không hợp lệ.

# {0} = maxBytes, {1} = allowedTypes[]
AVATAR_INVALID=Ảnh không hợp lệ. Vui lòng chọn ảnh JPG, PNG hoặc WebP dưới kích thước cho phép.

PAGINATION_CURSOR_INVALID=Danh sách đã thay đổi. Đang tải lại từ đầu.

# --- Nhóm L: DSAR, retention, sự cố bảo mật (L52–L62) ---
# {0} = publicRef
DSAR_SELF_APPROVAL_FORBIDDEN=Người đề xuất xoá tài khoản không được tự phê duyệt. Yêu cầu {0} cần một DPO khác duyệt.

# {0} = policyCode, {1} = maxDays
RETENTION_LIMIT_EXCEEDED=Thời hạn lưu của {0} không được vượt {1} ngày. Đây là cam kết đã công bố, không nới được bằng cấu hình.

SECURITY_INCIDENT_NOT_FOUND=Không tìm thấy hồ sơ sự cố này.
