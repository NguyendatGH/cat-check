
CONSENT_MANDATORY_CANNOT_WITHDRAW=Mục đích {0} là bắt buộc để cung cấp dịch vụ. Nếu bạn không muốn CatCheck xử lý dữ liệu nữa, hãy dùng chức năng Xoá tài khoản.

CONSENT_REQUIRED=Bạn cần đồng ý mục đích "{1}" để dùng tính năng này. Vào Trung tâm quyền riêng tư để cấp đồng ý.

