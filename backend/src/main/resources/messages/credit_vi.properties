
CREDIT_INSUFFICIENT=Bạn đã hết credit và hết lượt dùng thử. Hiện còn {0} credit, cần {1}. Bạn có thể kích hoạt gói khác; màu cát vệ sinh chỉ là dấu hiệu tham khảo, không phải chẩn đoán.

ACTIVATION_CODE_MALFORMED=Mã không đúng dạng {0}. Mã có dạng CC-<TÊN GÓI>-<10 KÝ TỰ>.

ACTIVATION_CODE_INVALID=Mã không hợp lệ. Kiểm tra lại mã trên bao bì, kể cả chữ O và số 0.

ACTIVATION_CODE_ALREADY_USED=Mã này đã được dùng lúc {0}.

ACTIVATION_CODE_EXPIRED=Mã đã hết hạn kích hoạt từ {0}. Hạn của mã khác với hạn của gói credit.

ACTIVATION_RATE_LIMITED=Bạn thao tác hơi nhanh. Vui lòng thử lại sau.

FEATURE_NOT_IN_PLAN=Tính năng {0} chưa có trong gói hiện tại của bạn.

WRITE_ACCESS_EXPIRED=Gói của bạn đã hết hạn nên không tạo mới được. Bạn vẫn xem được dữ liệu đã có.

credit.activation.code.required=Vui lòng nhập mã kích hoạt.
credit.activation.code.too-long=Mã quá dài. Mã có dạng CC-<TÊN GÓI>-<10 KÝ TỰ>.
credit.activation.code.malformed=Mã chỉ gồm chữ, số và dấu gạch ngang.

ACTIVATION_BATCH_TOO_LARGE=Mỗi lần sinh tối đa {0} mã.
ACTIVATION_CSV_ALREADY_DOWNLOADED=Tệp CSV của lô này chỉ tải được một lần và đã không còn. Muốn có mã mới, hãy vô hiệu hoá cả lô rồi sinh lô khác.
ACTIVATION_BATCH_EXISTS=Lô sản xuất "{0}" đã có mã phát hành. Hãy dùng một mã lô khác.
ACTIVATION_BATCH_NOT_FOUND=Không tìm thấy lô mã này.
PACKAGE_PLAN_NOT_FOUND=Không tìm thấy gói "{0}".

CREDIT_ADJUST_LIMIT_EXCEEDED=Vượt hạn mức điều chỉnh (tối đa {0} credit mỗi lần, {1} mỗi ngày). Hôm nay bạn còn {2} credit.
CREDIT_ADJUST_EXCEEDS_BALANCE=Không thu hồi được nhiều hơn số dư hiện có ({0} credit); yêu cầu thu hồi {1}.
