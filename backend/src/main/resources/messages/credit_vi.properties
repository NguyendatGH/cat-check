# Thông điệp lỗi nghiệp vụ của module credit (module `credit`, A4).
#
# Khoá = tên hằng CreditErrorCode, ví dụ CREDIT_INSUFFICIENT.
# Tra qua shared.i18n.MessageResolver với tham số {0}, {1}... theo thứ tự khai trong
# javadoc của từng hằng.
#
# ⚠ Hai việc CHƯA xong, ghi ở docs/handovers/A4.md:
#   1. shared/config/LocaleConfig#messageSource chỉ đăng ký basename
#      "classpath:messages/messages" và "classpath:messages/errors". File này CHƯA được
#      nạp cho tới khi W3 thêm basename vào danh sách. MessageSource có
#      setUseCodeAsDefaultMessage(true) nên thiếu file chỉ ra mã lỗi thay vì 500.
#   2. CreditErrorCode đã đăng ký vào ErrorCodeRegistry bằng cách mỗi hằng là một
#      @Bean ErrorCode riêng (xem CreditErrorCodeConfiguration) — KHÔNG dùng
#      @Bean List<ErrorCode> vì ErrorCodeRegistry nhận List qua constructor và Spring
#      sẽ không còn bean định danh duy nhất.
#
# QUY TẮC COPY: KHÔNG hứa hẹn y tế. Cát vệ sinh đổi màu là DẤU HIỆU tham khảo, không phải
# chẩn đoán. Mọi thông điệp dưới đây chỉ nói về quyền và số liệu, không nói về sức khoẻ mèo.

# {0} = số credit khả dụng, {1} = số credit cần
CREDIT_INSUFFICIENT=Bạn đã hết credit và hết lượt dùng thử. Hiện còn {0} credit, cần {1}. Bạn có thể kích hoạt gói khác; màu cát vệ sinh chỉ là dấu hiệu tham khảo, không phải chẩn đoán.

# {0} = dạng mã đúng (tham số expectedFormat)
ACTIVATION_CODE_MALFORMED=Mã không đúng dạng {0}. Mã có dạng CC-<TÊN GÓI>-<10 KÝ TỰ>.

# Cố ý không phân biệt "không tồn tại" và "đã bị thu hồi" — p11 §11.7.4.
ACTIVATION_CODE_INVALID=Mã không hợp lệ. Kiểm tra lại mã trên bao bì, kể cả chữ O và số 0.

# {0} = thời điểm đã dùng, {1} = "true"/"false" (mã do chính người đang đăng nhập dùng).
# Tham số thứ hai quyết định nên nói "bạn đã dùng mã này" hay giữ chung — xem p11 §11.7.4:
# không tiết lộ mã đã dùng bởi người khác.
ACTIVATION_CODE_ALREADY_USED=Mã này đã được dùng{0}.

# {0} = thời điểm hết hạn kích hoạt
ACTIVATION_CODE_EXPIRED=Mã đã hết hạn kích hoạt từ {0}. Hạn của mã khác với hạn của gói credit.

# {0} = tên tính năng, {1} = gói hiện tại, {2} = gói cần kích hoạt
FEATURE_NOT_IN_PLAN=Tính năng {0} chưa có trong gói của bạn. Gói hiện tại: {1}, cần {2}.

WRITE_ACCESS_EXPIRED=Gói của bạn đã hết hạn nên không tạo mới được. Bạn vẫn xem được dữ liệu đã có.

# Khoá validation của ActivateCreditCodeRequest (@Valid). Đặt ở đây vì A4 sở hữu
# messages/credit_*.properties; GlobalExceptionHandler tra qua cùng MessageSource.
credit.activation.code.required=Vui lòng nhập mã kích hoạt.
credit.activation.code.too-long=Mã quá dài. Mã có dạng CC-<TÊN GÓI>-<10 KÝ TỰ>.
credit.activation.code.malformed=Mã chỉ gồm chữ, số và dấu gạch ngang.

# --- Quan tri ma kich hoat & goi (L19-L26, p8 §8.4.12) ---
ACTIVATION_BATCH_TOO_LARGE=Mỗi lần sinh tối đa {0} mã.
ACTIVATION_CSV_ALREADY_DOWNLOADED=Tệp CSV của lô này chỉ tải được một lần và đã không còn. Muốn có mã mới, hãy vô hiệu hoá cả lô rồi sinh lô khác.
ACTIVATION_BATCH_EXISTS=Lô sản xuất "{0}" đã có mã phát hành. Hãy dùng một mã lô khác.
ACTIVATION_BATCH_NOT_FOUND=Không tìm thấy lô mã này.
PACKAGE_PLAN_NOT_FOUND=Không tìm thấy gói "{0}".
