VALIDATION_FAILED=Dữ liệu gửi lên không hợp lệ: {0}.

PRECONDITION_REQUIRED=Thiếu thông tin phiên bản. Vui lòng tải lại trang cấu hình.

RESOURCE_MODIFIED=Dữ liệu vừa được thay đổi ở nơi khác. Vui lòng tải lại rồi sửa tiếp.
