# Thông điệp lỗi nghiệp vụ của module colorchart (module `colorchart`, A5).
#
# Khoá = tên hằng ColorChartErrorCode, ví dụ COLOR_CHART_IN_USE.
# Tra qua shared.i18n.MessageResolver với tham số {0}, {1}... theo thứ tự khai trong
# javadoc của từng hằng.
#
# ⚠ Hai việc CHƯA xong, ghi ở docs/handovers/A5.md:
#   1. shared/config/LocaleConfig#messageSource chỉ đăng ký basename
#      "classpath:messages/messages" và "classpath:messages/errors". File này CHƯA được
#      nạp cho tới khi W3 thêm basename vào danh sách.
#   2. ColorChartErrorCode CHƯA đăng ký vào ErrorCodeRegistry — cần W3 gộp.
#
# QUY TẮC COPY: KHÔNG hứa hẹn y tế. Cát vệ sinh đổi màu là DẤU HIỆU tham khảo, không phải
# chẩn đoán. Mọi thông điệp dưới đây chỉ nói về cấu hình hệ thống.

# {0} = chartId
COLOR_CHART_NOT_FOUND=Không tìm thấy bảng màu {0}.

# {0} = chartId, {1} = status
COLOR_CHART_IN_USE=Bảng màu này đang được sử dụng. Hãy tạo phiên bản mới thay vì sửa trực tiếp.

# {0} = danh sách lỗi (missing)
COLOR_CHART_INCOMPLETE=Bảng màu chưa đủ dữ liệu để kích hoạt. Thiếu: {0}.

# {0} = code, {1} = version
COLOR_CHART_CODE_TAKEN=Đã tồn tại bảng mã {0} phiên bản {1}.

# {0} = code
PH_BAND_NOT_FOUND=Không tìm thấy dải phân loại {0}.

# {0} = code, {1} = otherCode
PH_BAND_OVERLAP=Dải phân loại {0} chồng lấn với dải {1} trên trục pH.

# {0} = minLength
REASON_REQUIRED=Vui lòng nhập lý do (ít nhất {0} ký tự).

# {0} = required roles
ADMIN_ROLE_REQUIRED=Bạn không có quyền quản trị bảng màu. Cần một trong các vai trò: {0}.

# {0} = param name
VALIDATION_FAILED=Dữ liệu gửi lên không hợp lệ: {0}.

# 428 — thiếu If-Match
PRECONDITION_REQUIRED=Thiếu thông tin phiên bản. Vui lòng tải lại trang cấu hình.

# {0} = current ETag
RESOURCE_MODIFIED=Dữ liệu vừa được thay đổi ở nơi khác. Vui lòng tải lại rồi sửa tiếp.
