PH_BAND_COVERAGE_GAP=Thay đổi này để lại một đoạn trên trục pH không thuộc dải phân loại nào (gần pH {0}).

PH_BAND_REQUIRED=Dải phân loại {0} là bắt buộc, không thể tắt.

