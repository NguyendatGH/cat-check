
COLOR_CHART_NOT_FOUND=Không tìm thấy bảng màu {0}.

COLOR_CHART_IN_USE=Bảng màu này đang được sử dụng. Hãy tạo phiên bản mới thay vì sửa trực tiếp.

COLOR_CHART_INCOMPLETE=Bảng màu chưa đủ dữ liệu để kích hoạt. Thiếu: {0}.

