# Module cat - tieng Viet (p8 SS8.2.4(d)).
# Khoa: <CODE> - code() cua CatErrorCode (KHONG co tien to "error.").
CAT_NOT_FOUND=Không tìm thấy hồ sơ bé mèo này.
CAT_PROFILE_LIMIT_REACHED=Gói hiện tại cho phép tối đa {0} hồ sơ mèo. Kích hoạt gói {1} để thêm bé mới.
CAT_HARD_LIMIT_REACHED=Mỗi tài khoản tạo được tối đa {0} hồ sơ mèo. Liên hệ hỗ trợ nếu bạn cần nhiều hơn.
CAT_ALREADY_DELETED=Hồ sơ này đã được xoá trước đó.
CAT_ALREADY_ARCHIVED=Hồ sơ của bé đã được lưu trữ trước đó.
CAT_BREED_UNKNOWN=Giống mèo không hợp lệ.
