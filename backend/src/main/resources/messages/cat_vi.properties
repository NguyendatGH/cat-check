AVATAR_INVALID=Ảnh không hợp lệ. Vui lòng chọn ảnh JPG, PNG hoặc WebP dưới {0} MB.
ACCOUNT_RESTRICTED=Tài khoản đang ở chế độ hạn chế xử lý theo yêu cầu của bạn. Bạn vẫn xem được dữ liệu nhưng không tạo mới được.
SORT_FIELD_NOT_ALLOWED=Không sắp xếp được theo tiêu chí này.
