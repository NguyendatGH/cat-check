# English counterpart of ai_vi.properties (module `ai`, A2-A4 wiring task,
# docs/cat-rag-credit-pipeline.md mục A2-A4).
#
# Key = AiErrorCode constant name.

CONVERSATION_NOT_FOUND=This conversation was not found, or it does not belong to you.
AI_MESSAGE_INVALID=Invalid question (empty, or longer than 4000 characters).
AI_PROVIDER_FAILED=The assistant is having trouble right now. Please try again later.
AI_CHAT_RATE_LIMITED=You are asking a bit fast. Please try again in a few minutes.

# Deliberately NO ai.emergency.* keys here: the only reviewed/approved wording for the
# emergency disclaimer lives in Vietnamese (frontend `shared/i18n/locales/vi/cat.json` key
# `disclaimer.emergency` — the frontend `en` locale folder is currently empty, so there is no
# approved English translation anywhere in this codebase). Machine-translating safety-critical
# medical copy without vet review would violate the "no invented medical content" hard rule for
# this task, so `AiChatService` resolves `ai.emergency.*` against a HARD-CODED `vi` Locale
# regardless of the request's Accept-Language — see `AiChatService.EMERGENCY_LOCALE`. If an
# approved English translation is produced later, add the keys here AND remove the hard-coded
# locale override in `AiChatService`.
