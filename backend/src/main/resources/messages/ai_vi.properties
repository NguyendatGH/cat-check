# Thông điệp của module ai (module `ai`, nhiệm vụ wiring A2-A4,
# docs/cat-rag-credit-pipeline.md mục A2-A4).
#
# Khoá = tên hằng AiErrorCode cho mã lỗi, hoặc ai.emergency.* cho đường khẩn cấp (xem dưới).
# Tra qua shared.i18n.MessageResolver với tham số {0}, {1}... theo thứ tự khai trong javadoc
# của từng hằng/điểm gọi.

CONVERSATION_NOT_FOUND=Không tìm thấy hội thoại này, hoặc hội thoại không thuộc về bạn.
AI_MESSAGE_INVALID=Câu hỏi không hợp lệ (trống hoặc quá 4000 ký tự).
AI_PROVIDER_FAILED=Trợ lý đang gặp sự cố, vui lòng thử lại sau.
AI_CHAT_RATE_LIMITED=Bạn hỏi hơi nhanh. Vui lòng thử lại sau ít phút.

# ============================================================================
# Đường khẩn cấp (bắt buộc, ưu tiên cao nhất, không qua LLM) — xem
# ai.application.AiChatService, nhánh "CatContext.openHealthFlags() có severity=URGENT".
# ============================================================================

# `ai.emergency.body` SAO CHÉP NGUYÊN VĂN frontend
# `frontend/src/shared/i18n/locales/vi/cat.json` khoá `disclaimer.emergency`
# (title + intro + 5 points + outro, dùng ở EmergencyContent/ClinicalSignEmergencyNotice/
# EmergencyDisclaimerBanner của features/cat/components.tsx) — KHÔNG đổi một chữ nào của nội
# dung đã duyệt, CHỈ đổi cách trình bày: xuống dòng + dấu "- " đầu dòng thay cho <ul><li> của
# JSX, vì câu trả lời chat là văn bản thuần (AssistantPage.tsx render bằng
# `whitespace-pre-wrap`), không phải JSX.
#
# ⚠ SỬA MỘT BÊN PHẢI SỬA CẢ HAI — chưa có cơ chế đồng bộ tự động giữa file này và
# frontend cat.json. Nếu nội dung khẩn cấp được duyệt lại, cập nhật CẢ hai nơi.
ai.emergency.body=⚠️ Những dấu hiệu cần đi thú y NGAY — đừng chờ theo dõi thêm\n\nHãy đưa bé đến cơ sở thú y ngay lập tức nếu bạn thấy:\n- Bé rặn nhiều nhưng không ra nước tiểu, hoặc chỉ ra vài giọt\n- Bé kêu, gào, tỏ ra đau khi đi vệ sinh\n- Bé ra vào khay liên tục mà khay vẫn khô\n- Nước tiểu có máu\n- Bé bỏ ăn, nôn, nằm li bì, bụng căng cứng\n\nTắc nghẽn đường tiểu là tình trạng cấp cứu và có thể nguy hiểm đến tính mạng trong vòng 24–48 giờ. Trong những trường hợp này, đừng dùng CatCheck để chờ theo dõi thêm — hãy gọi cho phòng khám thú y gần nhất.

# Câu dẫn + gợi ý mở hồ sơ — KHÔNG phải nội dung y khoa, do agent thực hiện nhiệm vụ wiring
# A2-A4 soạn theo đúng gợi ý mẫu trong brief nhiệm vụ (không trích từ care_tip hay bất kỳ nguồn
# đã duyệt nào khác) — thuần tuý là câu dẫn + điều hướng, KHÔNG diễn giải y khoa.
# {0} = tên mèo (hoặc "Bé mèo" nếu chưa đặt tên)
ai.emergency.lead={0} đang có cảnh báo mức khẩn cấp:
# {0} = catId
ai.emergency.viewDetail=Mở hồ sơ /cats/{0} để xem chi tiết.
