# Thông điệp lỗi nghiệp vụ của module scan (module `scan`, A6).
#
# Khoá = tên hằng ScanErrorCode, ví dụ SCAN_NOT_FOUND. KHÔNG có tiền tố "error.".
# Tra qua shared.i18n.MessageResolver với tham số {0}, {1}... theo đúng thứ tự khai trong
# javadoc của từng hằng trong ScanErrorCode.java.
#
# QUY TẮC COPY (p17 REQ-COPY-01): KHÔNG hứa hẹn y tế. Kết quả quét chỉ là DẤU HIỆU tham khảo
# từ màu cát, không phải chẩn đoán. Không dùng từ "bệnh", "chẩn đoán", "điều trị", "nguy cơ bệnh"
# trong bất kỳ thông điệp nào dưới đây.

SCAN_METADATA_INVALID=Dữ liệu gửi kèm không hợp lệ. Vui lòng thử quét lại.
IMAGE_TOO_SMALL=Ảnh quá nhỏ để phân tích. Hãy chụp lại gần hơn.
IMAGE_TOO_LARGE=Ảnh vượt quá dung lượng cho phép. Hãy chụp lại hoặc giảm chất lượng ảnh.
IMAGE_FORMAT_UNSUPPORTED=Định dạng ảnh không được hỗ trợ. Hãy chụp lại bằng camera của ứng dụng.
IMAGE_DECODE_FAILED=Không đọc được ảnh vừa gửi. Hãy thử chụp lại.
CAT_NOT_OWNED=Không tìm thấy bé mèo này trong hồ sơ của bạn.
SCAN_IN_PROGRESS=Lần quét này đang được xử lý. Vui lòng đợi trong giây lát.
SCAN_REQUEST_NOT_FOUND=Không tìm thấy yêu cầu quét này.
SCAN_NOT_FOUND=Không tìm thấy lần quét này.
SCAN_ANALYSIS_NOT_FOUND=Chưa có kết quả phân tích chi tiết cho lần quét này.
# {0} = lý do không lưu ảnh (store_image_reason: TRIAL | CONSENT_OFF | PLAN_OFF | INCONCLUSIVE)
SCAN_IMAGE_NOT_STORED=Ảnh của lần quét này không được lưu lại ({0}).
# {0} = thời điểm hết hạn lưu ảnh
SCAN_IMAGE_EXPIRED=Ảnh của lần quét này đã hết hạn lưu trữ từ {0} theo chính sách bảo mật.
SCAN_ALREADY_DELETED=Lần quét này đã được xoá trước đó.
SCAN_REASSIGN_WINDOW_CLOSED=Đã quá 24 giờ kể từ lúc quét nên không thể đổi bé mèo. Vui lòng liên hệ hỗ trợ.
SCAN_REASSIGN_LIMIT_REACHED=Lần quét này đã được đổi bé mèo tối đa 3 lần.
SCAN_NOT_REASSIGNABLE=Không thể đổi bé mèo cho lần quét này.
SCAN_REASSIGN_SAME_TARGET=Bé mèo mới trùng với bé mèo hiện tại.
SCAN_ALREADY_DISPUTED=Lần quét này đã được đánh dấu là không chính xác trước đó.
SCAN_DISPUTE_NOT_FOUND=Lần quét này chưa được đánh dấu là không chính xác.
SCAN_CHART_UNAVAILABLE=Hệ thống đang cập nhật bảng màu. Vui lòng thử lại sau.
VISION_ENGINE_UNAVAILABLE=Tính năng quét tạm thời gián đoạn. Vui lòng thử lại sau ít phút.
SCAN_PIPELINE_ERROR=Có lỗi khi phân tích ảnh. Bạn thử lại nhé.
SCAN_BUSY=Hệ thống đang xử lý nhiều yêu cầu. Vui lòng thử lại sau ít giây.
SORT_NOT_SUPPORTED_WITH_CURSOR=Thứ tự sắp xếp này không được hỗ trợ khi dùng phân trang con trỏ.

# Cờ chất lượng (p6 §6.3.4, §6.5.1) - khoá scan.quality.<code>, dùng ở QualityFlagResponse.messageKey.
scan.quality.BLURRY=Ảnh bị mờ. Giữ máy chắc, chạm vào màn hình để lấy nét rồi chụp lại.
scan.quality.TOO_DARK=Ảnh quá tối. Hãy chụp ở nơi sáng hơn hoặc bật thêm đèn phòng.
scan.quality.TOO_BRIGHT=Ảnh quá sáng. Hãy giảm bớt nguồn sáng chiếu thẳng.
scan.quality.OVEREXPOSED=Ảnh bị cháy sáng/loá. Tránh để đèn hoặc nắng chiếu thẳng vào vùng cát.
scan.quality.UNDEREXPOSED_PATCH=Vùng cát có mảng tối. Thử đổi góc để ánh sáng đều hơn.
scan.quality.UNEVEN_LIGHTING=Ánh sáng không đều - có thể do bóng của bạn hoặc của điện thoại. Hãy đổi tư thế đứng.
scan.quality.CARD_NOT_FOUND=Không thấy thẻ màu tham chiếu. Kết quả chỉ mang tính tham khảo - đặt thẻ vào khung để đo chính xác hơn.
scan.quality.CALIBRATION_UNAVAILABLE=Không đủ vùng màu trung tính để hiệu chỉnh màu. Kết quả có độ tin cậy thấp.
scan.quality.LOW_GRANULE_COVERAGE=Tỉ lệ hạt chỉ thị trong khung thấp hơn bình thường.
scan.quality.NO_INDICATOR_GRAINS=Không nhận diện được hạt chỉ thị đổi màu trong khung hình.
scan.quality.FEW_BLOBS=Số hạt màu đo được còn ít, kết quả có độ tin cậy thấp hơn.
scan.quality.MIXED_COLORS=Các hạt màu đo được không đồng nhất, có thể lẫn tạp chất.
scan.quality.OUT_OF_CHART_RANGE=Màu đo được nằm ngoài dải bảng màu hiện có.

# Gợi ý chụp lại (p8 §8.5.4 retryHintKey) khi kết quả INCONCLUSIVE.
scan.retry.blurry=Ảnh bị mờ. Giữ máy chắc, chạm vào màn hình để lấy nét rồi chụp lại.
scan.retry.generic=Ảnh chưa đủ điều kiện để đo màu chính xác. Hãy thử chụp lại theo hướng dẫn.
