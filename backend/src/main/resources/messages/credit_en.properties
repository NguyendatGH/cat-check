# Business error messages for module `credit` (owner: A4).
#
# Key = CreditErrorCode constant name, e.g. CREDIT_INSUFFICIENT.
# Resolved by shared.i18n.MessageResolver with {0}, {1}... in the order declared in each
# constant's javadoc.
#
# ⚠ TWO GAPS, recorded in docs/handovers/A4.md:
#   1. shared/config/LocaleConfig#messageSource registers only the basenames
#      "classpath:messages/messages" and "classpath:messages/errors". THIS FILE IS NOT LOADED
#      until W3 adds its basename. MessageSource has setUseCodeAsDefaultMessage(true), so a
#      missing bundle degrades to the raw error code rather than a 500.
#   2. CreditErrorCode IS registered with ErrorCodeRegistry — each constant is an individual
#      @Bean ErrorCode (see CreditErrorCodeConfiguration). A @Bean List<ErrorCode> cannot be
#      used: ErrorCodeRegistry takes the list via constructor and Spring would no longer have
#      a unique bean.
#
# COPY RULE: no medical promises. Litter colour is a reference signal, not a diagnosis. Every
# message below talks about entitlements and counts only, never about the cat's health.

# {0} = available credit, {1} = needed credit
CREDIT_INSUFFICIENT=You have run out of credit and trial scans. {0} credit available, {1} needed. You can activate a different package. Litter colour is a reference signal only, not a diagnosis.

# {0} = expected format (expectedFormat parameter)
ACTIVATION_CODE_MALFORMED=Code format is not {0}. A code looks like CC-<PACKAGE>-<10 CHARACTERS>.

# Deliberately does not distinguish "does not exist" from "revoked" — p11 §11.7.4.
ACTIVATION_CODE_INVALID=This code is not valid. Check the code on the pack, including the letter O and the digit 0.

# {0} = the moment it was redeemed, {1} = "true"/"false" (redeemed by the caller).
# The second argument decides whether to say "you already used this code" or stay generic —
# see p11 §11.7.4: never disclose a code redeemed by somebody else.
ACTIVATION_CODE_ALREADY_USED=This code has already been used{0}.

# {0} = activation expiry moment
ACTIVATION_CODE_EXPIRED=This code expired on {0}. The code's activation deadline is separate from the package's credit validity.

# {0} = feature name, {1} = current package, {2} = required package
FEATURE_NOT_IN_PLAN=Feature {0} is not included in your package. Current package: {1}, required: {2}.

WRITE_ACCESS_EXPIRED=Your package has expired, so new items cannot be created. You can still view your existing data.

# @Valid keys for ActivateCreditCodeRequest. They live here because A4 owns
# messages/credit_*.properties; GlobalExceptionHandler resolves through the same MessageSource.
credit.activation.code.required=Please enter an activation code.
credit.activation.code.too-long=Code is too long. A code looks like CC-<PACKAGE>-<10 CHARACTERS>.
credit.activation.code.malformed=A code contains only letters, digits and hyphens.

# --- Activation code & package administration (L19-L26, p8 §8.4.12) ---
ACTIVATION_BATCH_TOO_LARGE=At most {0} codes can be generated per batch.
ACTIVATION_CSV_ALREADY_DOWNLOADED=The CSV for this batch can be downloaded only once and is no longer available. To obtain new codes, void the batch and generate a new one.
ACTIVATION_BATCH_EXISTS=Production batch "{0}" already has issued codes. Please use a different batch identifier.
ACTIVATION_BATCH_NOT_FOUND=Batch not found.
PACKAGE_PLAN_NOT_FOUND=Package "{0}" not found.
