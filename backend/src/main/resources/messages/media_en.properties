# Error messages for the media module (MediaErrorCode). Key = enum constant name.
# Parameters (content type, storage key, byte counts, internal error text) are intentionally not
# interpolated: storage keys and error text are internal, and the content type is client input.
STORAGE_UNSUPPORTED_TYPE=This image format is not supported. Please use a JPEG, PNG or WebP image.
STORAGE_PAYLOAD_TOO_LARGE=The image exceeds the allowed size. Please choose a smaller image.
STORAGE_KEY_NOT_FOUND=The requested image was not found.
STORAGE_IO_ERROR=Image storage is having trouble. Please try again later.
