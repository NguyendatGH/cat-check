# Message lỗi nghiệp vụ của module content (care_tip), khoá theo ContentErrorCode#code().
# Encoding: UTF-8 (xem shared.i18n.LocaleConfig#messageSource - setDefaultEncoding("UTF-8")).
#
# Bug thật đã sửa: bundle này KHÔNG tồn tại và "classpath:messages/content" KHÔNG nằm trong
# basenames của LocaleConfig#messageSource, nên MỌI ContentErrorCode (L40-L45: not-found,
# source-required, self-approval-forbidden, not-editable, invalid-state, slug-taken) rơi vào
# nhánh setUseCodeAsDefaultMessage(true) của MessageSource và trả thẳng TÊN ENUM (vd
# "CONTENT_NOT_FOUND") cho client thay vì câu đã dịch — kể cả khi CareTipAdminService đã tính
# sẵn tham số (status cũ/mới, slug, locale...) để nội suy vào câu.
#
# REASON_REQUIRED/VALIDATION_FAILED của ContentErrorCode CỐ Ý không khai ở đây: hai mã này
# trùng tên với mã cùng tên ở colorchart/identity (ErrorCode#code() dùng name() làm khoá, chưa
# namespace theo module - xem ghi chú "W3 gộp lại" ở ContentErrorCode), và
# ReloadableResourceBundleMessageSource#getMessage chỉ dùng basename ĐẦU TIÊN khớp khoá trong
# danh sách basenames (đã xác nhận bằng test thủ công) — colorchart/identity đứng trước content
# trong danh sách nên bản dịch của content nếu khai ở đây cũng không bao giờ được chọn. Không
# thêm bản sao chết; xem báo cáo review cho hướng xử lý triệt để (gộp theo W3).
CONTENT_NOT_FOUND=Không tìm thấy bài viết chăm sóc được yêu cầu.
CONTENT_SOURCE_REQUIRED=Bài có tuyên bố "{0}" phải có nguồn tham chiếu trước khi công bố.
CONTENT_SELF_APPROVAL_FORBIDDEN=Người soạn không được tự duyệt bài của chính mình.
CONTENT_NOT_EDITABLE=Bài đang ở trạng thái {0} nên không thể sửa trực tiếp.
CONTENT_INVALID_STATE=Không thể chuyển bài từ trạng thái {0} sang {1}.
CONTENT_SLUG_TAKEN=Slug "{0}" đã tồn tại cho ngôn ngữ "{1}".
