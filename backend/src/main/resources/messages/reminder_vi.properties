# Thông điệp lỗi nghiệp vụ của module reminder. Khoá = tên hằng ReminderErrorCode.
# KHÔNG hứa hẹn y tế (p17 REQ-COPY-01).

REMINDER_NOT_FOUND=Không tìm thấy lịch nhắc này.
REMINDER_LIMIT_REACHED=Bé này đã có một lịch nhắc đang bật cùng loại. Hãy sửa lịch hiện có thay vì tạo thêm.
REMINDER_SCHEDULE_INVALID=Thiết lập lịch chưa hợp lệ. Vui lòng kiểm tra lại khoảng lặp, khung giờ và kênh nhận.
