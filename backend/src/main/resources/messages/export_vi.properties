export.pdf.date_pattern=dd/MM/yyyy
export.pdf.header=<strong>Về tài liệu này.</strong> Đây là bản ghi do chủ nuôi tự thực hiện tại nhà bằng ứng dụng CatCheck, dựa trên quan sát màu của hạt chỉ thị trong cát vệ sinh. <strong>Đây không phải kết quả xét nghiệm của cơ sở thú y</strong> và không thay thế thăm khám lâm sàng hay xét nghiệm. Giá trị pH hiển thị là <strong>ước lượng từ ảnh chụp</strong>, có thể sai lệch do ánh sáng, thiết bị chụp và điều kiện môi trường. Việc gán kết quả cho từng cá thể mèo do <strong>chủ nuôi tự thực hiện</strong>; hệ thống không tự nhận diện được con mèo nào đã sử dụng khay.
export.pdf.emergency.title=⚠️ Những dấu hiệu cần đi thú y NGAY — đừng chờ theo dõi thêm
export.pdf.emergency.body=Hãy đưa bé đến cơ sở thú y <strong>ngay lập tức</strong> nếu bạn thấy: bé <strong>rặn nhiều nhưng không ra nước tiểu</strong> hoặc chỉ ra vài giọt; bé <strong>kêu, gào, tỏ ra đau</strong> khi đi vệ sinh; bé <strong>ra vào khay liên tục</strong> mà khay vẫn khô; nước tiểu <strong>có máu</strong>; bé <strong>bỏ ăn, nôn, nằm li bì, bụng căng cứng</strong>. Tắc nghẽn đường tiểu là <strong>tình trạng cấp cứu</strong> và có thể nguy hiểm đến tính mạng <strong>trong vòng 24-48 giờ</strong>. Trong những trường hợp này, <strong>đừng dùng CatCheck để chờ theo dõi thêm</strong> — hãy gọi cho phòng khám thú y gần nhất.
export.pdf.footer.disclaimer=CatCheck — dữ liệu theo dõi tại nhà, mang tính tham khảo. Không phải kết quả xét nghiệm. Không thay thế bác sĩ thú y.
