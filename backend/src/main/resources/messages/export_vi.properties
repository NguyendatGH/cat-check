export.pdf.methodology.intro=Chủ nuôi chụp ảnh vùng cát đổi màu sau khi mèo đi vệ sinh, cùng khung hình với thẻ màu tham chiếu in kèm bao bì CatCheck. Hệ thống hiệu chỉnh màu theo thẻ tham chiếu (khi có), đối chiếu màu hạt chỉ thị với bảng ánh xạ màu → pH (phiên bản {0}), rồi ước lượng giá trị pH.
export.pdf.methodology.uncalibrated=chưa hiệu chuẩn (placeholder)
export.pdf.methodology.no_card_note=Một số lần đo trong kỳ được thực hiện không có thẻ tham chiếu trong khung hình; những lần đó có độ tin cậy thấp hơn và được đánh dấu ở cột "Cảnh báo chất lượng".
export.pdf.methodology.limits_title=Giới hạn của phương pháp:
export.pdf.methodology.limit1=Đây là ước lượng qua màu sắc quan sát bằng camera điện thoại, không phải phép đo hoá học trực tiếp như que thử pH hoặc xét nghiệm nước tiểu tại phòng thí nghiệm.
export.pdf.methodology.limit2=Kết quả phụ thuộc điều kiện ánh sáng, góc chụp, và việc đặt đúng thẻ màu tham chiếu trong khung hình lúc chụp.
export.pdf.methodology.limit3=Hệ thống chỉ đo pH, không phát hiện máu, protein, tinh thể hay các thành phần khác trong nước tiểu.
export.pdf.methodology.limit4=Hệ thống không tự xác định con mèo nào vừa đi vệ sinh — độ tin cậy của dữ liệu phụ thuộc vào việc chủ nuôi gắn đúng kết quả cho đúng con mèo.
export.pdf.methodology.limit5=Khoảng tham chiếu 6,3–6,6 áp dụng cho pH nước tiểu mèo khoẻ mạnh nói chung; từng cá thể có thể có mức nền khác nhau, bác sĩ nên đối chiếu với bệnh sử riêng của mèo.
