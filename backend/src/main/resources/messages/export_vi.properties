# Thông điệp lỗi nghiệp vụ của module export (module `export`, A6).
# Khoá = tên hằng ExportErrorCode. KHÔNG hứa hẹn y tế (p17 REQ-COPY-01).

EXPORT_JOB_IN_PROGRESS=Bạn đang có một bản xuất khác đang xử lý. Vui lòng đợi bản đó hoàn tất.
EXPORT_NO_DATA=Không có dữ liệu quét nào trong khoảng thời gian đã chọn.
EXPORT_JOB_NOT_FOUND=Không tìm thấy bản xuất này.
EXPORT_NOT_READY=Bản xuất này chưa sẵn sàng để tải về.
EXPORT_EXPIRED=Bản xuất này đã hết hạn tải về. Hãy tạo một bản xuất mới.
EXPORT_RANGE_INVALID=Khoảng thời gian không hợp lệ. Vui lòng chọn lại (tối đa 12 tháng, không vượt quá hôm nay).
