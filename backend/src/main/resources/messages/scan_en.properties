# English messages for module scan (module `scan`, A6). Mirrors scan_vi.properties key-for-key.
# COPY RULE (p17 REQ-COPY-01): no medical claims - scan results are a color-based reference
# signal only, never a diagnosis. Do not use "disease", "diagnosis", "treatment", "risk of disease".

SCAN_METADATA_INVALID=The submitted data is invalid. Please try scanning again.
IMAGE_TOO_SMALL=The image is too small to analyze. Please take the photo closer.
IMAGE_TOO_LARGE=The image exceeds the allowed size. Please retake it or reduce the quality.
IMAGE_FORMAT_UNSUPPORTED=This image format is not supported. Please retake it with the app camera.
IMAGE_DECODE_FAILED=We could not read the uploaded image. Please try again.
CAT_NOT_OWNED=This cat was not found in your profile.
SCAN_IN_PROGRESS=This scan is still being processed. Please wait a moment.
SCAN_REQUEST_NOT_FOUND=This scan request was not found.
SCAN_NOT_FOUND=This scan was not found.
SCAN_ANALYSIS_NOT_FOUND=Detailed analysis is not available for this scan yet.
# {0} = reason the image was not stored (store_image_reason: TRIAL | CONSENT_OFF | PLAN_OFF | INCONCLUSIVE)
SCAN_IMAGE_NOT_STORED=The image for this scan was not stored ({0}).
# {0} = image expiry timestamp
SCAN_IMAGE_EXPIRED=The image for this scan expired on {0} under our storage policy.
SCAN_IMAGE_DSAR_REQUIRED=Scan images are viewable only while this account has an open data subject request.
SCAN_ALREADY_DELETED=This scan has already been deleted.
SCAN_REASSIGN_WINDOW_CLOSED=More than 24 hours have passed since capture, so the cat can no longer be changed. Please contact support.
SCAN_REASSIGN_LIMIT_REACHED=This scan has already been reassigned to a different cat 3 times.
SCAN_NOT_REASSIGNABLE=This scan cannot be reassigned to another cat.
SCAN_REASSIGN_SAME_TARGET=The new cat is the same as the current one.
SCAN_ALREADY_DISPUTED=This scan was already marked as inaccurate.
SCAN_DISPUTE_NOT_FOUND=This scan has not been marked as inaccurate.
SCAN_CHART_UNAVAILABLE=The color chart is being updated. Please try again later.
VISION_ENGINE_UNAVAILABLE=Scanning is temporarily unavailable. Please try again in a few minutes.
SCAN_PIPELINE_ERROR=Something went wrong while analyzing the image. Please try again.
SCAN_BUSY=The system is handling many requests right now. Please try again in a few seconds.
SORT_NOT_SUPPORTED_WITH_CURSOR=This sort order is not supported with cursor pagination.

scan.quality.BLURRY=The image is blurry. Hold the phone steady, tap to focus, then retake the photo.
scan.quality.TOO_DARK=The image is too dark. Take the photo in a brighter spot or turn on more light.
scan.quality.TOO_BRIGHT=The image is too bright. Reduce direct light on the litter area.
scan.quality.OVEREXPOSED=The image is overexposed/glared. Avoid direct light or sunlight on the litter area.
scan.quality.UNDEREXPOSED_PATCH=Part of the litter area is too dark. Try a different angle for even lighting.
scan.quality.UNEVEN_LIGHTING=Lighting is uneven - possibly your own shadow or the phone's. Try changing your position.
scan.quality.CARD_NOT_FOUND=Reference color card not found. This result is reference-only - place the card in frame for a more accurate reading.
scan.quality.CALIBRATION_UNAVAILABLE=Not enough neutral-color area to calibrate. This result has low confidence.
scan.quality.LOW_GRANULE_COVERAGE=The proportion of indicator granules in frame is lower than usual.
scan.quality.NO_INDICATOR_GRAINS=No color-changed indicator granules were detected in the frame.
scan.quality.FEW_BLOBS=Few color samples were measured, so the result has lower confidence.
scan.quality.MIXED_COLORS=The measured color samples are inconsistent, possibly mixed with debris.
scan.quality.OUT_OF_CHART_RANGE=The measured color falls outside the current color chart range.

scan.retry.blurry=The image is blurry. Hold the phone steady, tap to focus, then retake the photo.
scan.retry.generic=The image was not sufficient for an accurate color reading. Please retry following the guide.
