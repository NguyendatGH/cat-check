export.pdf.date_pattern=dd MMM yyyy
export.pdf.header=<strong>About this document.</strong> This is a record made by the cat owner at home with the CatCheck app, based on observing the color of the indicator granules in the litter. <strong>This is not a test result from a veterinary facility</strong> and does not replace a clinical examination or tests. The pH value shown is an <strong>estimate from a photo</strong> and may be off due to lighting, the camera and environmental conditions. Assigning results to each individual cat is <strong>done by the owner</strong>; the system cannot automatically identify which cat used the tray.
export.pdf.emergency.title=⚠️ Signs that need a vet RIGHT AWAY — do not wait and watch
export.pdf.emergency.body=Take your cat to a veterinary clinic <strong>immediately</strong> if you notice: your cat <strong>strains a lot but passes no urine</strong> or only a few drops; your cat <strong>cries, yowls or seems in pain</strong> when using the litter box; your cat <strong>keeps going in and out of the tray</strong> but the tray stays dry; <strong>blood in the urine</strong>; your cat <strong>stops eating, vomits, is very lethargic, or has a hard, swollen belly</strong>. A urinary blockage is an <strong>emergency</strong> and can be life-threatening <strong>within 24-48 hours</strong>. In these cases, <strong>do not use CatCheck to keep watching</strong> — call the nearest veterinary clinic.
export.pdf.footer.disclaimer=CatCheck — at-home monitoring data, for reference only. Not a test result. Does not replace a veterinarian.
