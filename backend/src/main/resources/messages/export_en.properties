export.pdf.methodology.title=Measurement method
export.pdf.methodology.intro=The owner photographs the color-changed litter area after the cat uses the litter box, in the same frame as the reference color card printed on the CatCheck packaging. The system calibrates colors against the reference card (when present), matches the indicator granule colors against the color-to-pH mapping table (version {0}), then estimates the pH value.
export.pdf.methodology.uncalibrated=not yet calibrated (placeholder)
export.pdf.methodology.no_card_note=Some measurements in this period were taken without the reference card in the frame; those measurements have lower confidence and are marked in the "Quality warning" column.
export.pdf.methodology.limits_title=Limitations of the method:
export.pdf.methodology.limit1=This is an estimate based on color observed with a phone camera, not a direct chemical measurement such as a pH test strip or a laboratory urine test.
export.pdf.methodology.limit2=The result depends on lighting conditions, shooting angle, and placing the reference color card correctly in the frame when taking the photo.
export.pdf.methodology.limit3=The system measures pH only; it does not detect blood, protein, crystals or other components in the urine.
export.pdf.methodology.limit4=The system does not identify which cat has just used the litter box — the reliability of the data depends on the owner assigning the result to the right cat.
export.pdf.methodology.limit5=The 6.3–6.6 reference range applies to the urine pH of healthy cats in general; individual cats may have a different baseline, and the veterinarian should compare it against the cat's own medical history.
