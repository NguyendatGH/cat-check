PRODUCT_NOT_FOUND=Không tìm thấy sản phẩm này.
CART_EMPTY=Giỏ hàng đang trống.
ORDER_NOT_FOUND=Không tìm thấy đơn hàng này.
STOCK_UNAVAILABLE=Số lượng trong kho không đủ cho sản phẩm bạn chọn.
ORDER_LIMIT_REACHED=Bạn đang có {0} đơn chưa thanh toán. Hãy thanh toán hoặc huỷ bớt trước khi đặt đơn mới.
ORDER_NOT_CANCELLABLE=Đơn này không thể huỷ nữa.
PAYMENT_UNAVAILABLE=Thanh toán qua PayOS đang tạm gián đoạn. Bạn có thể chọn thanh toán khi nhận hàng hoặc thử lại sau.

PRODUCT_SKU_DUPLICATE=Mã SKU này đã được dùng cho một sản phẩm khác.
PRODUCT_INVALID=Thông tin sản phẩm không hợp lệ. Kiểm tra lại mã SKU, đường dẫn ảnh và giá so sánh.
