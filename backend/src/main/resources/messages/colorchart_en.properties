# Business error messages for module `colorchart` (owner: A5).
#
# Key = ColorChartErrorCode constant name, e.g. COLOR_CHART_IN_USE.
# Resolved by shared.i18n.MessageResolver with {0}, {1}... in the order declared in each
# constant's javadoc.
#
# ⚠ TWO GAPS, recorded in docs/handovers/A5.md:
#   1. shared/config/LocaleConfig#messageSource registers only the basenames
#      "classpath:messages/messages" and "classpath:messages/errors". THIS FILE IS NOT LOADED
#      until W3 adds its basename.
#   2. ColorChartErrorCode is NOT yet registered in ErrorCodeRegistry — W3 must merge.
#
# COPY RULE: NO medical claims. Colour-changing litter is a REFERENCE INDICATOR, not a
# diagnosis. All messages below only concern system configuration.

# {0} = chartId
COLOR_CHART_NOT_FOUND=Colour chart {0} not found.

# {0} = chartId, {1} = status
COLOR_CHART_IN_USE=This colour chart is in use. Create a new version instead of editing directly.

# {0} = missing list
COLOR_CHART_INCOMPLETE=The colour chart does not have enough data to activate. Missing: {0}.

# {0} = code, {1} = version
COLOR_CHART_CODE_TAKEN=Chart code {0} version {1} already exists.

# {0} = code
PH_BAND_NOT_FOUND=Classification band {0} not found.

# {0} = code, {1} = otherCode
PH_BAND_OVERLAP=Classification band {0} overlaps with band {1} on the pH axis.

# {0} = minLength
REASON_REQUIRED=Please provide a reason (at least {0} characters).

# {0} = required roles
ADMIN_ROLE_REQUIRED=You do not have permission to manage colour charts. Required roles: {0}.

# {0} = param name
VALIDATION_FAILED=Invalid input: {0}.

# 428 — missing If-Match
PRECONDITION_REQUIRED=Missing version information. Please reload the configuration page.

# {0} = current ETag
RESOURCE_MODIFIED=The data has been modified elsewhere. Please reload and try again.
