
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    # MAIL_* thắng; thiếu thì dùng lại các biến SMTP_* của profile local.
    host: ${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_EMAIL:}}
    password: ${MAIL_PASSWORD:${SMTP_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

logging:
  level:
    com.catcheck: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
