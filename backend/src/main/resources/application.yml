spring:
  application:
    name: catcheck

  servlet:
    multipart:
      max-file-size: 9MB
      max-request-size: 10MB

  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
        use-legacy-structure: true

  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

catcheck:
  storage:
    provider: ${CATCHECK_STORAGE_PROVIDER:auto}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:catcheck}

  oauth2:
    mock-enabled: false
    frontend-success-url: ${CATCHECK_OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:5173/auth/oauth/complete}

  ai:
    enabled: ${CATCHECK_AI_ENABLED:false}
    base-url: ${CATCHECK_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    chat-model: ${CATCHECK_AI_CHAT_MODEL:gpt-4o-mini}
    max-context-chunks: 6
    max-history-messages: 8
    max-tokens: 700
  jobs:
    enabled: true
    zone: Asia/Ho_Chi_Minh

    expire-credit-batches:
      enabled: true
      cron: "0 5 * * * *"
      lock-at-most-for: PT50M
      batch-size: 500
      max-items-per-run: 5000
      dry-run: false

    credit-expiring-reminder:
      enabled: true
      cron: "0 15 * * * *"
      lock-at-most-for: PT50M
      batch-size: 500
      max-items-per-run: 5000
      dry-run: false

    report-pdf-timeout:
      enabled: true
      cron: "0 */15 * * * *"
      lock-at-most-for: PT10M
      stale-after: PT15M
      dry-run: false

    job-heartbeat-check:
      enabled: true
      cron: "0 */10 * * * *"
      lock-at-most-for: PT5M
      batch-size: 100
      max-items-per-run: 100
      dry-run: false

    send-due-reminders:
      enabled: true
      cron: "0 */5 * * * *"
      lock-at-most-for: PT4M30S
      batch-size: 200
      max-items-per-run: 1000
      dry-run: false

    send-email-outbox:
      enabled: true
      cron: "*/30 * * * * *"
      lock-at-most-for: PT25S
      batch-size: 50
      max-items-per-run: 50
      dry-run: false

    retry-failed-notifications:
      enabled: true
      cron: "0 */15 * * * *"
      lock-at-most-for: PT14M
      batch-size: 100
      max-items-per-run: 100
      dry-run: false

    cleanup-dead-push-tokens:
      enabled: true
      cron: "0 0 4 * * SUN"
      lock-at-most-for: PT30M
      batch-size: 500
      max-items-per-run: 5000
      dry-run: false

  notification:
    push:
      service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
      project-id: ${FIREBASE_PROJECT_ID:}
      max-devices-per-user: 10
    outbox:
      max-attempts: 5
      email-batch-size: 50
      push-batch-size: 100

  i18n:
    default-locale: vi
    supported-locales: vi,en

  dev:
    manual-scan-enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
