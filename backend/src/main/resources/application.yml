spring:
  application:
    name: catcheck

  servlet:
    multipart:
      max-file-size: 9MB
      max-request-size: 10MB

  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        # Không đặt provider.google.issuer-uri: khi có, Spring gọi accounts.google.com lúc khởi động
        # để lấy cấu hình và backend không chạy được khi mất mạng/DNS. Registration id "google" đã dùng
        # endpoint + issuer cố định của CommonOAuth2Provider.GOOGLE.
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
        use-legacy-structure: true

  sql:
    init:
      mode: never

server:
  port: 8080
  # Tin X-Forwarded-Host/Proto tu proxy noi bo (Caddy, Vite dev proxy cho tunnel) de {baseUrl}
  # cua OAuth redirect_uri la domain cong khai, khong phai localhost:8080.
  forward-headers-strategy: native

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

catcheck:
  storage:
    provider: ${CATCHECK_STORAGE_PROVIDER:auto}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:catcheck}

  auth:
    # Temporarily raised from the default 5; set CATCHECK_AUTH_MAX_CONCURRENT_SESSIONS to change.
    max-concurrent-sessions: ${CATCHECK_AUTH_MAX_CONCURRENT_SESSIONS:20}

  credit:
    # Quà chào mừng cho mỗi tài khoản người mua mới (đăng ký email đã xác minh / Google OAuth).
    welcome-bonus:
      enabled: ${CATCHECK_WELCOME_BONUS_ENABLED:true}
      amount: ${CATCHECK_WELCOME_BONUS_AMOUNT:10}
      validity: ${CATCHECK_WELCOME_BONUS_VALIDITY:5d}

  oauth2:
    mock-enabled: false
    frontend-success-url: ${CATCHECK_OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:5173/auth/oauth/complete}

  ai:
    enabled: ${CATCHECK_AI_ENABLED:false}
    # OpenRouter (OpenAI-compatible). Model là cấu hình: chạy smoke test với openrouter/free, rồi ghim
    # một model ":free" cố định sau golden set (docs/AI_HYBRID_RAG_PLAN.md mục 2, 5).
    base-url: ${CATCHECK_AI_BASE_URL:https://openrouter.ai/api/v1}
    # Biến riêng của CatCheck; OPENAI_API_KEY chỉ còn là tên cũ được chấp nhận để không gãy cấu hình cũ.
    api-key: ${CATCHECK_AI_API_KEY:${OPENAI_API_KEY:}}
    chat-model: ${CATCHECK_AI_CHAT_MODEL:openrouter/free}
    max-context-chunks: 6
    max-history-messages: 8
    max-tokens: 700
    # Timeout HTTP tới provider LLM — provider treo không được giữ luồng request vô hạn.
    connect-timeout: ${CATCHECK_AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${CATCHECK_AI_READ_TIMEOUT:30s}
    # Ngân sách toàn hệ thống cho provider: số lời gọi đồng thời tối đa và thời gian ngắt sau 429/5xx/timeout.
    max-concurrent-calls: ${CATCHECK_AI_MAX_CONCURRENT_CALLS:2}
    circuit-open-for: ${CATCHECK_AI_CIRCUIT_OPEN_FOR:60s}
    # Đồng bộ kho tri thức (chỉ phần đổi hash) ngay khi app khởi động, chạy nền.
    index-on-startup: ${CATCHECK_AI_INDEX_ON_STARTUP:true}
    # Thư mục model embedding cục bộ (tools/fetch-embedding-model.sh). Trống = chỉ retrieval lexical.
    embedding-model-dir: ${CATCHECK_AI_EMBEDDING_MODEL_DIR:}
    # Cosine tối thiểu để chunk chỉ-vector vào context (e5: cặp đúng ≥ 0.90, sai ≤ 0.86 trên seed);
    # đo lại bằng golden set trước khi bật provider.
    min-vector-similarity: ${CATCHECK_AI_MIN_VECTOR_SIMILARITY:0.88}
  jobs:
    enabled: true
    zone: Asia/Ho_Chi_Minh

    expire-credit-batches:
      enabled: true
      cron: "0 5 * * * *"
      lock-at-most-for: PT50M
      batch-size: 500
      max-items-per-run: 5000
      dry-run: false

    credit-expiring-reminder:
      enabled: true
      cron: "0 15 * * * *"
      lock-at-most-for: PT50M
      batch-size: 500
      max-items-per-run: 5000
      dry-run: false

    report-pdf-timeout:
      enabled: true
      cron: "0 */15 * * * *"
      lock-at-most-for: PT10M
      stale-after: PT15M
      dry-run: false

    job-heartbeat-check:
      enabled: true
      cron: "0 */10 * * * *"
      lock-at-most-for: PT5M
      batch-size: 100
      max-items-per-run: 100
      dry-run: false

    send-due-reminders:
      enabled: true
      cron: "0 */5 * * * *"
      lock-at-most-for: PT4M30S
      batch-size: 200
      max-items-per-run: 1000
      dry-run: false

    send-email-outbox:
      enabled: true
      cron: "*/30 * * * * *"
      lock-at-most-for: PT25S
      batch-size: 50
      max-items-per-run: 50
      dry-run: false

    retry-failed-notifications:
      enabled: true
      cron: "0 */15 * * * *"
      lock-at-most-for: PT14M
      batch-size: 100
      max-items-per-run: 100
      dry-run: false

    cleanup-dead-push-tokens:
      enabled: true
      cron: "0 0 4 * * SUN"
      lock-at-most-for: PT30M
      batch-size: 500
      max-items-per-run: 5000
      dry-run: false

  notification:
    push:
      service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
      project-id: ${FIREBASE_PROJECT_ID:}
      max-devices-per-user: 10
    outbox:
      max-attempts: 5
      email-batch-size: 50
      push-batch-size: 100

  shop:
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      timeout-ms: 10000
      max-retries: 0
      payment-ttl: PT5M

  i18n:
    default-locale: vi
    supported-locales: vi,en

  dev:
    manual-scan-enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
