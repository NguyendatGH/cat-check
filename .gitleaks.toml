title = "CatCheck gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "figma-personal-access-token"
description = "Figma Personal Access Token"
regex = '''figd_[A-Za-z0-9_-]{20,}'''
tags = ["figma", "pat", "catcheck-custom"]

[[rules]]
id = "generic-secret-like-assignment"
description = "Hard-coded high-entropy secret assignment"
regex = '''(?i)(secret|pepper|api[_-]?key|private[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9+/_-]{32,}={0,2}["']?'''
tags = ["generic", "high-entropy", "catcheck-custom"]
