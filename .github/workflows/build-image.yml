name: Build Images

# architecture.yml: KHÔNG tách file riêng — gộp vào backend-ci.yml làm job
# `architecture-check` (xem file đó) vì cần chạy song song + chia sẻ cache/
# setup JDK với job compile/test, tách file riêng sẽ phải lặp lại toàn bộ
# phần setup không cần thiết.

on:
  pull_request: {} # build-only (không push) — xác nhận Dockerfile không hỏng
  push:
    branches: [main]
    tags: ["v*"]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/catcheck-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/catcheck-frontend
  BACKEND_MAX_SIZE_MB: 350

jobs:
  build:
    name: Build (+ push khi push main/tag)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # PHẢI ở đầu job: build kéo base image từ Docker Hub.
      - name: Docker Hub login
        uses: docker/login-action@v3.3.0 # TODO owner xác nhận version (chưa có trong BOM đã pin)
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1 # TODO owner xác nhận version (chưa có trong BOM đã pin)

      - name: Login GHCR (chỉ cần khi sẽ push)
        if: github.event_name == 'push'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Xác định tag image
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Build (mọi PR + mọi push) — không push, chỉ để smoke-check ----
      - name: Build backend image (local, để inspect size)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:build-check
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (local, để xác nhận Dockerfile không hỏng)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:build-check
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-check kích thước image backend (< 350 MB)
        run: |
          size_bytes=$(docker image inspect "${{ env.BACKEND_IMAGE }}:build-check" --format='{{.Size}}')
          size_mb=$(( size_bytes / 1024 / 1024 ))
          echo "Kích thước image backend: ${size_mb} MB (giới hạn ${{ env.BACKEND_MAX_SIZE_MB }} MB)"
          if [ "$size_mb" -ge "${{ env.BACKEND_MAX_SIZE_MB }}" ]; then
            echo "::error::Image backend ${size_mb}MB >= giới hạn ${{ env.BACKEND_MAX_SIZE_MB }}MB"
            exit 1
          fi

      # ---- Push (chỉ khi push main/tag — PR chỉ build để xác nhận) ----
      - name: Push backend image — ${{ steps.meta.outputs.tag }}
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push backend image — latest (chỉ khi push tag vX.Y.Z)
        if: steps.meta.outputs.is_release == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend

      - name: Push frontend image — ${{ steps.meta.outputs.tag }}
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push frontend image — latest (chỉ khi push tag vX.Y.Z)
        if: steps.meta.outputs.is_release == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
