name: Secret Scan

# Job quan trọng nhất trong toàn bộ CI: repo này ĐÃ TỪNG có figma-key.txt chứa
# Figma Personal Access Token dạng plain text ở thư mục gốc (xem
# SECURITY-NOTE.md). Dù đã gitignore, job `gitleaks` PHẢI là required status
# check (cấu hình ở GitHub branch protection, ngoài phạm vi file YAML này) —
# chặn merge cứng, KHÔNG có ngưỡng cảnh báo nào để "chỉ warn".

on:
  pull_request: {} # quét diff của PR
  schedule:
    - cron: "0 20 * * 1" # thứ 2 hằng tuần, 20:00 UTC ≈ 03:00 giờ VN — quét TOÀN BỘ lịch sử

jobs:
  gitleaks:
    name: Gitleaks (chặn merge cứng)
    runs-on: ubuntu-latest
    steps:
      # gitleaks-action là docker container action — pull image ⇒ cần login
      # Docker Hub trước để tránh anonymous rate-limit.
      - name: Docker Hub login
        uses: docker/login-action@v4.6.0 # TODO owner xác nhận version
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # PR: quét diff so với base; cron: quét toàn bộ lịch sử

      # KHÔNG dùng @master/@latest — 2 version dưới đây CHƯA có trong BOM đã
      # pin (spec/reference/research-integrations.md §15), owner cần xác nhận:
      #   - gitleaks/gitleaks-action@v2.3.9  (action wrapper)
      #   - GITLEAKS_VERSION 8.21.2          (gitleaks CLI)
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9 # TODO owner xác nhận version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.21.2" # TODO owner xác nhận version
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  frontend-bundle-scan:
    name: Quét bundle FE đã build tìm secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci && build (frontend/dist)
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # Không có tool sẵn phù hợp cho quét bundle JS đã build — script tự viết
      # (xem .github/scripts/scan-frontend-bundle.sh), tìm: khối PEM,
      # "private_key", client_secret, chuỗi base64 >=40 ký tự cạnh
      # secret|pepper|key.
      - name: Quét frontend/dist tìm secret lọt vào bundle production
        run: bash .github/scripts/scan-frontend-bundle.sh frontend/dist
